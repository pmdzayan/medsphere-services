networks:
  medsphere-infra:
    external: true
    name: medsphere-infra-network

services:
  notification-worker:
    image: medsphere-auth-service:local
    container_name: medsphere-notification-worker
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: auth-service
    command: ['dist/notification-delivery.daemon.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_CLUSTER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?AUTH_JWT_PRIVATE_KEY_BASE64 is required}
      AUTH_JWT_PUBLIC_KEY_BASE64: ${AUTH_JWT_PUBLIC_KEY_BASE64:?AUTH_JWT_PUBLIC_KEY_BASE64 is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:?AUTH_JWT_KEY_ID is required}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_IDLE_TTL_SECONDS: ${AUTH_REFRESH_IDLE_TTL_SECONDS:-604800}
      AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: ${AUTH_REFRESH_ABSOLUTE_TTL_SECONDS:-2592000}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:?AUTH_REFRESH_TOKEN_PEPPER is required}
      AUTH_ARGON2_MEMORY_KIB: ${AUTH_ARGON2_MEMORY_KIB:-19456}
      AUTH_ARGON2_TIME_COST: ${AUTH_ARGON2_TIME_COST:-2}
      AUTH_ARGON2_PARALLELISM: ${AUTH_ARGON2_PARALLELISM:-1}
      NOTIFICATION_WORKER_LIMIT: ${NOTIFICATION_WORKER_LIMIT:-25}
      NOTIFICATION_WORKER_LEASE_MS: ${NOTIFICATION_WORKER_LEASE_MS:-30000}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:-5}
      NOTIFICATION_WORKER_POLL_INTERVAL_MS: ${NOTIFICATION_WORKER_POLL_INTERVAL_MS:-5000}
      NOTIFICATION_EMAIL_PROVIDER_ENABLED: ${NOTIFICATION_EMAIL_PROVIDER_ENABLED:-false}
      NOTIFICATION_EMAIL_PROVIDER_KEY: ${NOTIFICATION_EMAIL_PROVIDER_KEY:-}
      NOTIFICATION_EMAIL_PROVIDER_CREDENTIAL_REFERENCE: ${NOTIFICATION_EMAIL_PROVIDER_CREDENTIAL_REFERENCE:-}
      NOTIFICATION_EMAIL_PROVIDER_TIMEOUT_MS: ${NOTIFICATION_EMAIL_PROVIDER_TIMEOUT_MS:-5000}
      NOTIFICATION_EMAIL_FROM_ADDRESS: ${NOTIFICATION_EMAIL_FROM_ADDRESS:-}
      NOTIFICATION_SMTP_URL: ${NOTIFICATION_SMTP_URL:-}
    networks:
      - medsphere-infra
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
