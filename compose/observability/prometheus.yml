global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/aim-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - aim-alertmanager:9093

scrape_configs:
  - job_name: aim-otel-collector
    honor_labels: true
    static_configs:
      - targets:
          - aim-otel-collector:9464
    metric_relabel_configs:
      # The collector boundary exports only application metrics plus target
      # health. Keep the backend equally narrow if the collector config drifts.
      - source_labels: [__name__]
        regex: '(medsphere_.+|up)'
        action: keep
