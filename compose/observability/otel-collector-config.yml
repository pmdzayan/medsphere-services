extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: aim-auth-service
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets:
                - auth-service:3000

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48
  filter/aim_metrics:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - ^medsphere_.*
          - ^up$
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464

service:
  extensions:
    - health_check
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - memory_limiter
        - filter/aim_metrics
        - batch
      exporters:
        - prometheus
