global:
  resolve_timeout: 5m

route:
  receiver: aim-warning
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: aim-critical
      repeat_interval: 30m

receivers:
  - name: aim-warning
    webhook_configs:
      - url_file: /run/secrets/aim-alert-webhook-url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
  - name: aim-critical
    webhook_configs:
      - url_file: /run/secrets/aim-alert-webhook-url
        send_resolved: true
        max_alerts: 20
        timeout: 10s

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
