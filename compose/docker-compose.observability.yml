# Task 0049 production-reference observability stack.
#
# This file is deliberately separate from the default development compose.
# It requires an operator-managed HTTPS alert webhook secret and exposes no
# Prometheus/Alertmanager host ports. Any human UI/API exposure must be added
# through an authenticated TLS ingress approved by the deployment owner.

networks:
  medsphere-apps:
    external: true
    name: medsphere-apps-network
  aim-observability:
    internal: true
  # Alertmanager alone receives outbound network access for the operator HTTPS
  # webhook. No application service joins this network.
  aim-alert-egress: {}

volumes:
  aim-prometheus-data:
  aim-alertmanager-data:

services:
  # The collector is defined by docker-compose.services.yml. This override is
  # the only bridge between the application network and the monitoring-only
  # network; application containers never join aim-observability.
  aim-otel-collector:
    networks:
      - medsphere-apps
      - aim-observability

  aim-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: aim-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docs/operations/v1-alert-rules.prometheus.yml:/etc/prometheus/aim-alert-rules.yml:ro
      - aim-prometheus-data:/prometheus
    expose:
      - '9090'
    networks:
      - aim-observability
    depends_on:
      - aim-alertmanager
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  aim-alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: aim-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=720h
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${AIM_ALERT_WEBHOOK_URL_FILE:?AIM_ALERT_WEBHOOK_URL_FILE is required}:/run/secrets/aim-alert-webhook-url:ro
      - aim-alertmanager-data:/alertmanager
    expose:
      - '9093'
    networks:
      - aim-observability
      - aim-alert-egress
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
