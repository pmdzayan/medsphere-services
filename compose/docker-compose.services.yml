# NOTE: the top-level `version:` key is removed — Compose V2 ignores it and
# warns on every invocation; the schema version is inferred from the CLI now.
#
# NOTE: per-service `healthcheck:` blocks are removed. Each image already
# declares a working HEALTHCHECK in the Dockerfile (see scripts/healthcheck.js)
# — Compose uses that automatically. Keeping a second, separate healthcheck
# definition here is exactly how the previous wget-based check silently went
# stale: two places that must independently agree end up drifting apart.
# Override here only if a specific service genuinely needs different timing.

networks:
  medsphere-infra:
    external: true
    name: medsphere-infra-network
  medsphere-apps:
    external: true
    name: medsphere-apps-network

services:
  auth-service:
    image: medsphere-auth-service:local
    container_name: medsphere-auth-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: auth-service
    environment:
      NODE_ENV: development
      PORT: 3000
      # Required, no fallback default: an unset secret now fails the container
      # at startup instead of silently running with a guessable value.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_CLUSTER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - medsphere-infra
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  inventory-service:
    image: medsphere-inventory-service:local
    container_name: medsphere-inventory-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: inventory-service
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_CLUSTER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:9092
    networks:
      - medsphere-infra
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  reservation-service:
    image: medsphere-reservation-service:local
    container_name: medsphere-reservation-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: reservation-service
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_CLUSTER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      KAFKA_BROKERS: kafka:9092
    networks:
      - medsphere-infra
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  billing-service:
    image: medsphere-billing-service:local
    container_name: medsphere-billing-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: billing-service
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      # FIX: was "KAFKA_BROKENS" — the env var billing-service actually reads
      # is KAFKA_BROKERS. With the typo, billing-service silently never
      # received a broker address and any Kafka client here would fail to
      # connect (or fall back to a library default) with no clear error.
      KAFKA_BROKERS: kafka:9092
    networks:
      - medsphere-infra
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  notification-service:
    image: medsphere-notification-service:local
    container_name: medsphere-notification-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: notification-service
    environment:
      NODE_ENV: development
      PORT: 3000
      KAFKA_BROKERS: kafka:9092
    networks:
      - medsphere-infra
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  search-service:
    image: medsphere-search-service:local
    container_name: medsphere-search-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: search-service
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_CLUSTER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    networks:
      - medsphere-infra
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api-gateway:
    image: medsphere-api-gateway:local
    container_name: medsphere-gateway-app
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET_SERVICE: api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      RESERVATION_SERVICE_URL: http://reservation-service:3000
      INVENTORY_SERVICE_URL: http://inventory-service:3000
      SEARCH_SERVICE_URL: http://search-service:3000
    networks:
      - medsphere-apps
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
