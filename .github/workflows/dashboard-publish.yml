name: Temporary Dashboard Patch Publisher

on:
  push:
    branches:
      - cto/runtime-cert-dashboard
    paths:
      - .github/workflows/dashboard-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: cto/runtime-cert-dashboard
          fetch-depth: 0

      - name: Verify and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .dashboard-publish/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/dashboard-browser-cert.patch
          echo 'b60205d694db5ed42591bc161ecc6f930933effa9888af15d73f5ed8ef889798  /tmp/dashboard-browser-cert.patch' | sha256sum --check --strict
          git apply --check /tmp/dashboard-browser-cert.patch
          git apply /tmp/dashboard-browser-cert.patch
          rm -rf .dashboard-publish
          rm -f .github/workflows/dashboard-publish.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --name-only | grep -Fx '.github/workflows/task5-smoke-test.yml'
          git diff --cached --name-only | grep -Fx 'apps/web/e2e/dashboard.spec.ts'
          git diff --cached --name-only | grep -Fx 'apps/web/package.json'
          git diff --cached --name-only | grep -Fx 'apps/web/playwright.config.ts'
          git diff --cached --name-only | grep -Fx 'apps/web/vitest.config.ts'
          git diff --cached --name-only | grep -Fx 'pnpm-lock.yaml'
          git diff --cached --name-only | grep -Fx 'scripts/task5-smoke-test.mjs'

      - name: Commit and publish exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MedSphere CI Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(cert): add genuine Dashboard browser runtime certification'
          git push origin HEAD:cto/runtime-cert-dashboard
