name: Task 0043 formatter helper

on:
  push:
    branches:
      - cto/0043-pharmacy-pos-billing-gst-invoice
    paths:
      - .github/workflows/task-0043-generate-migration.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/0043-pharmacy-pos-billing-gst-invoice
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 0043 files
        run: |
          pnpm exec prettier --write \
            apps/auth-service/src/pos/pos-checkout.service.ts \
            apps/auth-service/src/pos/pos-event-writer.ts \
            apps/auth-service/src/pos/pos-fiscal.service.ts \
            apps/auth-service/src/pos/pos.controller.ts \
            "apps/web/src/app/api/pos/providers/[providerId]/checkout/route.ts" \
            "apps/web/src/app/api/pos/providers/[providerId]/fiscal-profile/route.ts" \
            "apps/web/src/app/api/pos/providers/[providerId]/inventories/[inventoryId]/fiscal-profile/route.ts" \
            "apps/web/src/app/api/pos/providers/[providerId]/products/[productId]/quote/route.ts" \
            "apps/web/src/app/api/pos/providers/[providerId]/sales/[saleId]/reprint/route.ts" \
            "apps/web/src/app/api/pos/providers/[providerId]/sales/[saleId]/route.ts" \
            "apps/web/src/app/api/pos/providers/[providerId]/sales/[saleId]/void/route.ts" \
            apps/web/src/lib/api-client.ts \
            apps/web/src/lib/i18n-catalogs/pos.ts \
            apps/web/src/lib/pos-contract.ts \
            apps/web/src/lib/pos-money.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/auth-service/src/pos \
            apps/web/src/app/api/pos \
            apps/web/src/lib/api-client.ts \
            apps/web/src/lib/i18n-catalogs/pos.ts \
            apps/web/src/lib/pos-contract.ts \
            apps/web/src/lib/pos-money.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(pos): format Task 0043 implementation"
          git push origin HEAD:cto/0043-pharmacy-pos-billing-gst-invoice
