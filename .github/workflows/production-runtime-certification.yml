name: AIM Production Runtime & Deployment Safety Certification

on:
  pull_request:
  push:
    branches:
      - main
      - feature/database-architecture
      - cto/*

concurrency:
  group: cert-production-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify-runtime:
    name: Production Runtime & Deployment Safety Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Check architecture and runtime policy invariants
        run: pnpm test:architecture

      - name: Run production runtime certification suite
        run: pnpm test:production-runtime

      - name: Run auth-service regression suite
        run: pnpm --filter @medsphere/auth-service test

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint workspace
        run: pnpm lint

      - name: Build workspace artifacts
        run: pnpm build

      - name: Verify production container image build for accepted auth-service runtime
        run: |
          docker build --build-arg TARGET_SERVICE=auth-service -t aim-auth-service:test .
