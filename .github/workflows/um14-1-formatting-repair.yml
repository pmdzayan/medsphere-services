name: UM14.1 Formatting Repair

on:
  push:
    branches:
      - cto/um14-1-blue-green-environment-role-model

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/um14-1-blue-green-environment-role-model
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format UM14.1 files
        run: |
          pnpm exec prettier --write \
            docs/adr/README.md \
            docs/operations/production-deployment-runbook.md \
            PROJECT_RULES.md \
            scripts/blue-green-environment-role-model.mjs \
            scripts/blue-green-environment-role-model.spec.mjs
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/adr/README.md \
            docs/operations/production-deployment-runbook.md \
            PROJECT_RULES.md \
            scripts/blue-green-environment-role-model.mjs \
            scripts/blue-green-environment-role-model.spec.mjs
          git commit -m "style: format UM14.1 blue-green role model"
          git push origin HEAD:cto/um14-1-blue-green-environment-role-model
