name: AIM Stock Transfer Runtime Certification

on:
  workflow_dispatch: {}
  push:
    branches:
      - cto/runtime-cert-transfers
  pull_request:
    branches:
      - feature/database-architecture

concurrency:
  group: transfer-runtime-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transfers:
    name: Stock transfer runtime certification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://medsphere_ci:medsphere_ci@localhost:5432/medsphere_ci?schema=public
      REDIS_CLUSTER_URL: redis://localhost:6379
      ENABLE_UNACCEPTED_PROTOTYPE_SERVICES: 'false'
      AUTH_JWT_ISSUER: https://auth.local.medsphere.test
      AUTH_JWT_AUDIENCE: medsphere-api
      AUTH_JWT_KEY_ID: local-development-key
      AUTH_ACCESS_TOKEN_TTL_SECONDS: '900'
      AUTH_REFRESH_IDLE_TTL_SECONDS: '604800'
      AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: '2592000'
      AUTH_RECENT_AUTH_TTL_SECONDS: '300'
      AUTH_ARGON2_MEMORY_KIB: '19456'
      AUTH_ARGON2_TIME_COST: '2'
      AUTH_ARGON2_PARALLELISM: '1'
      PORT: '3000'
      AUTH_API_URL: http://auth.medsphere.test:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medsphere_ci
          POSTGRES_PASSWORD: medsphere_ci
          POSTGRES_DB: medsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsphere_ci -d medsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Configure synthetic auth-service hostname
        run: echo '127.0.0.1 auth.medsphere.test' | sudo tee -a /etc/hosts

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate synthetic JWT keys and refresh pepper
        run: |
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const { generateDevKeyMaterial } = require("./scripts/generate-dev-keys.js");
            const material = generateDevKeyMaterial();
            const required = {
              AUTH_JWT_PRIVATE_KEY_BASE64: material.privateKeyBase64,
              AUTH_JWT_PUBLIC_KEY_BASE64: material.publicKeyBase64,
              AUTH_REFRESH_TOKEN_PEPPER: material.refreshPepperBase64,
              AUTH_OTP_PEPPER: material.otpPepperBase64,
              ORG_JOIN_CODE_PEPPER: material.orgJoinCodePepperBase64,
            };
            for (const [name, value] of Object.entries(required)) {
              if (!value) throw new Error(`Missing generated value: ${name}`);
              console.log(`::add-mask::${value}`);
              const delimiter = `EOF_${crypto.randomBytes(8).toString("hex")}`;
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`, "utf8");
            }
          '

      - name: Verify database migration and drift
        run: pnpm db:verify

      - name: Build backend
        run: pnpm exec turbo run build --filter=@medsphere/auth-service

      - name: Build frontend
        run: pnpm --filter @medsphere/web build

      - name: Start backend
        run: |
          nohup node apps/auth-service/dist/main.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Start frontend
        run: |
          nohup pnpm --filter @medsphere/web exec next start -p 3001 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Certify Stock Transfers
        shell: bash
        run: |
          set +e
          # Runs the canonical, unmodified accepted harness directly --
          # the same pattern already used by reservation-runtime-cert.yml.
          # The runtime text-patching step this workflow previously used
          # here (rewriting a copy of the script to inject a dynamically
          # read source batch version and a destination listing
          # precondition) is now stale: scripts/task5-smoke-test.mjs
          # itself owns both of those fixes directly (a dedicated,
          # freshly received transfer source batch, and an explicit
          # destination inventory listing setup via the same accepted
          # configureInventory API), so patching a second, divergent
          # copy at CI time would only reintroduce the risk of the two
          # implementations drifting apart again. This job still only
          # gates on the specific transfer-related required lines below
          # -- it does not install Playwright/Chromium and does not
          # depend on the dashboard browser certification passing,
          # matching the same isolation already accepted by
          # reservation-runtime-cert.yml: an unrelated dashboard failure
          # remains visible in the evidence log but cannot invalidate
          # this transfer-only verdict.
          node scripts/task5-smoke-test.mjs 2>&1 | tee /tmp/transfer-cert.log
          smoke_exit=${PIPESTATUS[0]}
          set -e

          declare -a required_checks=(
            "stock transfer source batch precondition (dedicated, freshly received batch, accepted receiveBatch API)"
            "stock transfer destination listing precondition (accepted configureInventory API)"
            "stock transfer (correct source/target quantities)"
          )

          missing=0
          for name in "${required_checks[@]}"; do
            escaped=$(printf '%s' "$name" | sed -e 's/[.[\*^$/+]/\\&/g' -e 's/(/\\(/g' -e 's/)/\\)/g')
            if ! grep -Eq "^WORKING[[:space:]]+\[required\] ${escaped}\$" /tmp/transfer-cert.log; then
              echo "Stock transfer certification failed: required check was not WORKING: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo 'STOCK TRANSFER CERTIFICATION: PASS'
          echo "Full smoke script exit code: ${smoke_exit}. Later non-transfer failures (including the dashboard browser certification, which this job does not install a browser for) remain visible in the evidence log but are non-authoritative for this isolated Transfer verdict."

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Show frontend log on failure
        if: failure()
        run: cat /tmp/frontend.log || true

      - name: Upload Stock Transfer certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-transfer-certification-evidence
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            /tmp/transfer-cert.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          [ -f /tmp/frontend.pid ] && kill "$(cat /tmp/frontend.pid)" 2>/dev/null || true
          exit 0
