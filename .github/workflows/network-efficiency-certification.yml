name: AIM Network & Low-Bandwidth Certification

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - feature/database-architecture
  push:
    branches:
      - feature/database-architecture

concurrency:
  group: network-efficiency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-network:
    name: Constrained-mobile public route budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FRONTEND: http://127.0.0.1:3001
      AUTH_API_URL: http://auth.medsphere.test:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @medsphere/web exec playwright install --with-deps chromium

      - name: Verify static network/privacy boundary
        run: pnpm test:network-efficiency-boundary

      - name: Build production frontend
        run: pnpm --filter @medsphere/web build

      - name: Start production frontend
        run: |
          nohup pnpm --filter @medsphere/web exec next start -p 3001 > /tmp/network-frontend.log 2>&1 &
          echo $! > /tmp/network-frontend.pid

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/network-frontend.log || true
          exit 1

      - name: Certify constrained-mobile network budgets
        run: pnpm --filter @medsphere/web exec playwright test e2e/network-efficiency.spec.ts

      - name: Show frontend log on failure
        if: failure()
        run: cat /tmp/network-frontend.log || true

      - name: Upload network certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-0059-network-efficiency-evidence
          path: |
            /tmp/network-frontend.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop frontend
        if: always()
        run: |
          [ -f /tmp/network-frontend.pid ] && kill "$(cat /tmp/network-frontend.pid)" 2>/dev/null || true
          exit 0
