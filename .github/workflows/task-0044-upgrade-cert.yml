name: Task 0044 populated upgrade certification

on:
  push:
    branches:
      - cto/0044-inventory-exception-closure

permissions:
  contents: read

concurrency:
  group: task-0044-upgrade-cert
  cancel-in-progress: true

jobs:
  verify-upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medsphere_ci
          POSTGRES_PASSWORD: medsphere_ci
          POSTGRES_DB: medsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsphere_ci -d medsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://medsphere_ci:medsphere_ci@localhost:5432/medsphere_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/0044-inventory-exception-closure
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Task 0044 populated upgrade
        run: pnpm --filter @medsphere/database prisma:verify-0044-upgrade
