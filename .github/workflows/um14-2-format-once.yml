name: UM14.2 One-Shot Formatting Repair

on:
  push:
    branches:
      - cto/um14-2-database-sync-candidate-creation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: cto/um14-2-database-sync-candidate-creation
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format UM14.2 files
        run: >
          pnpm exec prettier --write
          docs/adr/README.md
          docs/operations/production-deployment-runbook.md
          PROJECT_RULES.md
          scripts/blue-green-candidate-sync.mjs

      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/README.md docs/operations/production-deployment-runbook.md PROJECT_RULES.md scripts/blue-green-candidate-sync.mjs
          git commit -m "style: format UM14.2 candidate sync"
          git push origin HEAD:cto/um14-2-database-sync-candidate-creation
