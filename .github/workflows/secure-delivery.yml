name: AIM Production Delivery — Intentionally Blocked

# Production delivery remains disabled until Milestone 11 is accepted. This
# manual workflow performs no deployment and exists to make the freeze visible.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-freeze:
    name: Production release gate is closed
    runs-on: ubuntu-24.04
    steps:
      - name: Explain release status
        run: |
          echo "Production deployment is intentionally disabled."
          echo "Complete the dependency-ordered roadmap and production-release acceptance gate first."
