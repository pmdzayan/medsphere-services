name: MedSphere Dashboard Runtime Certification

# Temporary validation infrastructure for the Dashboard vertical slice only.
# Login/authentication and RBAC are prerequisites, but this workflow's
# authoritative verdict is Dashboard only. Inventory and later stages are
# intentionally non-authoritative.
on:
  workflow_dispatch: {}
  push:
    branches:
      - cto/runtime-cert-dashboard
  pull_request:
    branches:
      - feature/database-architecture

concurrency:
  group: dashboard-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    name: Authenticated dashboard operational render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://medsphere_ci:medsphere_ci@localhost:5432/medsphere_ci?schema=public
      REDIS_CLUSTER_URL: redis://localhost:6379
      ENABLE_UNACCEPTED_PROTOTYPE_SERVICES: 'false'
      AUTH_JWT_ISSUER: https://auth.local.medsphere.test
      AUTH_JWT_AUDIENCE: medsphere-api
      AUTH_JWT_KEY_ID: local-development-key
      AUTH_ACCESS_TOKEN_TTL_SECONDS: '900'
      AUTH_REFRESH_IDLE_TTL_SECONDS: '604800'
      AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: '2592000'
      AUTH_ARGON2_MEMORY_KIB: '19456'
      AUTH_ARGON2_TIME_COST: '2'
      AUTH_ARGON2_PARALLELISM: '1'
      PORT: '3000'
      AUTH_API_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medsphere_ci
          POSTGRES_PASSWORD: medsphere_ci
          POSTGRES_DB: medsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsphere_ci -d medsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Dashboard browser runtime certification)
        run: pnpm --filter @medsphere/web exec playwright install --with-deps chromium

      - name: Generate synthetic JWT keys and refresh pepper
        run: |
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const { generateDevKeyMaterial } = require("./scripts/generate-dev-keys.js");
            const material = generateDevKeyMaterial();
            const required = {
              AUTH_JWT_PRIVATE_KEY_BASE64: material.privateKeyBase64,
              AUTH_JWT_PUBLIC_KEY_BASE64: material.publicKeyBase64,
              AUTH_REFRESH_TOKEN_PEPPER: material.refreshPepperBase64,
            };
            for (const [name, value] of Object.entries(required)) {
              if (!value) throw new Error(`Missing generated value: ${name}`);
              console.log(`::add-mask::${value}`);
              const delimiter = `EOF_${crypto.randomBytes(8).toString("hex")}`;
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`, "utf8");
            }
          '

      - name: Verify database migration and drift
        run: pnpm db:verify

      - name: Build backend
        run: pnpm exec turbo run build --filter=@medsphere/auth-service

      - name: Build frontend
        run: pnpm --filter @medsphere/web build

      - name: Start backend
        run: |
          nohup node apps/auth-service/dist/main.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Start frontend
        run: |
          nohup pnpm --filter @medsphere/web exec next start -p 3001 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Certify authenticated Dashboard
        shell: bash
        run: |
          set +e
          node scripts/task5-smoke-test.mjs 2>&1 | tee /tmp/dashboard-cert.log
          smoke_exit=${PIPESTATUS[0]}
          set -e

          # The script itself computes and prints an isolated Dashboard
          # verdict (tagged phase: 'dashboard' internally, covering
          # service startup, registration, authentication, RBAC allow/
          # deny, the unauthenticated redirect check, the authenticated
          # shell check, and the Playwright browser runtime
          # certification) independent of later Inventory/Reservation/
          # Notification checks in the same run. Checking for that one
          # line here is a single source of truth, rather than
          # duplicating each individual marker's exact text in this
          # workflow file, which would silently stop matching the
          # moment the script's own check names or set of Dashboard
          # checks changed.
          if ! grep -Fq 'DASHBOARD CERTIFICATION: PASS' /tmp/dashboard-cert.log; then
            echo 'Dashboard certification did not pass -- see the DASHBOARD CERTIFICATION VERDICT section above for the exact failing check(s).'
            exit 1
          fi

          echo 'DASHBOARD: WORKING'
          echo "Full smoke script exit code: ${smoke_exit}. Inventory and later feature failures are intentionally non-authoritative for this Dashboard verdict."

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Show frontend log on failure
        if: failure()
        run: cat /tmp/frontend.log || true

      - name: Upload Dashboard certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-certification-evidence
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            /tmp/dashboard-cert.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          [ -f /tmp/frontend.pid ] && kill "$(cat /tmp/frontend.pid)" 2>/dev/null || true
          exit 0
