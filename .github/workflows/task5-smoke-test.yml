name: Temporary Exact Dashboard Patch Publisher

on:
  push:
    branches:
      - cto/runtime-cert-dashboard
  pull_request:
    branches:
      - feature/database-architecture

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' || github.head_ref == 'cto/runtime-cert-dashboard'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: cto/runtime-cert-dashboard
          fetch-depth: 0

      - name: Verify exact uploaded patch and final seven-file scope
        shell: bash
        run: |
          set -euo pipefail
          echo '736e8cb6c126e4b78cdb80f46521c3da048afad3252e960923408a11488ef9e5  .dashboard-publish-gzip/chunk-01.b64' | sha256sum --check --strict
          echo 'b723d374028dad6bdb7bc0c36105c4533eadbf935513357989220241bd62e11a  .dashboard-publish-gzip/chunk-02.b64' | sha256sum --check --strict
          echo '8d282007c8bdc5f2a861c79eadf97d17a9c9cf996bc92cd6bf16340b73eb38e1  .dashboard-publish-gzip/chunk-03.b64' | sha256sum --check --strict
          echo '80d8a31b72d0357e39fe41d6cb83e2c95be727199a013c55f291991679b998d7  .dashboard-publish-gzip/chunk-04.b64' | sha256sum --check --strict
          cat .dashboard-publish-gzip/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/dashboard-browser-cert.patch.gz
          echo 'dc65a5d1c62f6da32e902ecc79c097adc8fd8b6d6d74aa4c885ebe922e2d46a7  /tmp/dashboard-browser-cert.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/dashboard-browser-cert.patch.gz > /tmp/dashboard-browser-cert.patch
          echo 'b60205d694db5ed42591bc161ecc6f930933effa9888af15d73f5ed8ef889798  /tmp/dashboard-browser-cert.patch' | sha256sum --check --strict

          git show a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5:.github/workflows/task5-smoke-test.yml > .github/workflows/task5-smoke-test.yml
          git apply --check /tmp/dashboard-browser-cert.patch
          git apply /tmp/dashboard-browser-cert.patch

          rm -rf .dashboard-publish .dashboard-publish-exact .dashboard-publish-gzip
          rm -f .github/workflows/dashboard-publish.yml

          git add -A
          git diff --check a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5
          test "$(git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | wc -l)" -eq 7
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx '.github/workflows/task5-smoke-test.yml'
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx 'apps/web/e2e/dashboard.spec.ts'
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx 'apps/web/package.json'
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx 'apps/web/playwright.config.ts'
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx 'apps/web/vitest.config.ts'
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx 'pnpm-lock.yaml'
          git diff --name-only a0f852ae97bc47fa5d1d0a05dedaba58c724f4a5 | grep -Fx 'scripts/task5-smoke-test.mjs'

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MedSphere CI Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(cert): add genuine Dashboard browser runtime certification'
          git push origin HEAD:cto/runtime-cert-dashboard
