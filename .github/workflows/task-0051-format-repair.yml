name: Task 0051 Formatting Repair

on:
  push:
    branches:
      - cto/0051-provider-domain-expansion-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/0051-provider-domain-expansion-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format Task 0051 files
        run: |
          pnpm exec prettier --write \
            apps/auth-service/src/authorization/authorization.controller.ts \
            apps/auth-service/src/authorization/dto/authorization-response.dto.ts \
            apps/auth-service/src/provider-domain/provider-domain.controller.ts \
            apps/auth-service/src/provider-domain/provider-domain.service.spec.ts \
            apps/auth-service/src/provider-domain/provider-domain.service.ts \
            apps/web/src/lib/audit-contract.ts \
            apps/web/src/lib/inventory-contract.ts \
            apps/web/src/lib/pharmacy-staff-contract.ts \
            packages/database/src/audit.ts \
            packages/security/src/provider-access.ts \
            packages/security/test/tenant-scope.spec.mjs
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/auth-service/src/authorization/authorization.controller.ts \
            apps/auth-service/src/authorization/dto/authorization-response.dto.ts \
            apps/auth-service/src/provider-domain/provider-domain.controller.ts \
            apps/auth-service/src/provider-domain/provider-domain.service.spec.ts \
            apps/auth-service/src/provider-domain/provider-domain.service.ts \
            apps/web/src/lib/audit-contract.ts \
            apps/web/src/lib/inventory-contract.ts \
            apps/web/src/lib/pharmacy-staff-contract.ts \
            packages/database/src/audit.ts \
            packages/security/src/provider-access.ts \
            packages/security/test/tenant-scope.spec.mjs
          git commit -m "style: format Task 0051 provider-domain foundation"
          git push origin HEAD:cto/0051-provider-domain-expansion-foundation
