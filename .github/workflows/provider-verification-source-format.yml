name: Verification Source Formatting Repair

on:
  push:
    branches:
      - cto/provider-verification-official-sources

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/provider-verification-official-sources
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format verification source files
        run: |
          pnpm exec prettier --write \
            apps/auth-service/src/pharmacy-verification/dto/pharmacy-verification.dto.ts \
            apps/auth-service/src/pharmacy-verification/pharmacy-verification.controller.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification-source.catalog.spec.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification-source.catalog.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification.service.spec.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification.service.ts \
            "apps/web/src/app/api/pharmacy/providers/[providerId]/verification/route.test.ts" \
            apps/web/src/features/pharmacy-profile/pharmacy-profile-workspace.test.tsx \
            apps/web/src/features/pharmacy-profile/pharmacy-profile-workspace.tsx \
            apps/web/src/lib/i18n-catalogs/pharmacy-profile.ts \
            apps/web/src/lib/pharmacy-verification-contract.test.ts \
            apps/web/src/lib/pharmacy-verification-contract.ts \
            docs/operations/provider-verification-official-sources.md
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/auth-service/src/pharmacy-verification/dto/pharmacy-verification.dto.ts \
            apps/auth-service/src/pharmacy-verification/pharmacy-verification.controller.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification-source.catalog.spec.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification-source.catalog.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification.service.spec.ts \
            apps/auth-service/src/pharmacy-verification/provider-verification.service.ts \
            "apps/web/src/app/api/pharmacy/providers/[providerId]/verification/route.test.ts" \
            apps/web/src/features/pharmacy-profile/pharmacy-profile-workspace.test.tsx \
            apps/web/src/features/pharmacy-profile/pharmacy-profile-workspace.tsx \
            apps/web/src/lib/i18n-catalogs/pharmacy-profile.ts \
            apps/web/src/lib/pharmacy-verification-contract.test.ts \
            apps/web/src/lib/pharmacy-verification-contract.ts \
            docs/operations/provider-verification-official-sources.md
          git commit -m "style: format provider verification source files"
          git push origin HEAD:cto/provider-verification-official-sources
