name: MedSphere V1 Core Runtime Regression

# Single authoritative certification of the merged V1 core runtime chain
# (Frontend -> Backend -> PostgreSQL -> Redis), covering, in order:
# service startup, registration/login, authenticated session, RBAC
# allow, RBAC deny, cross-tenant rejection, authenticated dashboard
# load, inventory configuration/listing, inventory batch/mutation,
# reservation creation, reservation lifecycle, and stock transfer.
#
# This reuses the existing accepted real-stack harness
# (scripts/task5-smoke-test.mjs) exactly as the Dashboard/Inventory/
# Reservations/Transfer workflows already do -- nothing here duplicates
# that harness. Public Search and Notification checks still run inside
# the same script invocation and remain fully visible in the uploaded
# evidence log, but are deliberately non-authoritative for this job's
# verdict, the same way later-capability checks are already treated as
# non-authoritative in the existing per-vertical workflows below. This
# job does not touch notification worker code, PR #108/#109 work, or
# anything else out of scope for V1 core runtime regression.
on:
  workflow_dispatch: {}
  push:
    branches:
      - cto/v1-core-runtime-regression
  pull_request:
    branches:
      - feature/database-architecture

concurrency:
  group: v1-core-runtime-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v1-core-runtime-regression:
    name: V1 core runtime regression certification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://medsphere_ci:medsphere_ci@localhost:5432/medsphere_ci?schema=public
      REDIS_CLUSTER_URL: redis://localhost:6379
      ENABLE_UNACCEPTED_PROTOTYPE_SERVICES: 'false'
      AUTH_JWT_ISSUER: https://auth.local.medsphere.test
      AUTH_JWT_AUDIENCE: medsphere-api
      AUTH_JWT_KEY_ID: local-development-key
      AUTH_ACCESS_TOKEN_TTL_SECONDS: '900'
      AUTH_REFRESH_IDLE_TTL_SECONDS: '604800'
      AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: '2592000'
      AUTH_ARGON2_MEMORY_KIB: '19456'
      AUTH_ARGON2_TIME_COST: '2'
      AUTH_ARGON2_PARALLELISM: '1'
      PORT: '3000'
      AUTH_API_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medsphere_ci
          POSTGRES_PASSWORD: medsphere_ci
          POSTGRES_DB: medsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsphere_ci -d medsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Dashboard browser runtime certification)
        run: pnpm --filter @medsphere/web exec playwright install --with-deps chromium

      - name: Generate synthetic JWT keys and refresh pepper
        run: |
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const { generateDevKeyMaterial } = require("./scripts/generate-dev-keys.js");
            const material = generateDevKeyMaterial();
            const required = {
              AUTH_JWT_PRIVATE_KEY_BASE64: material.privateKeyBase64,
              AUTH_JWT_PUBLIC_KEY_BASE64: material.publicKeyBase64,
              AUTH_REFRESH_TOKEN_PEPPER: material.refreshPepperBase64,
              AUTH_OTP_PEPPER: material.otpPepperBase64,
            };
            for (const [name, value] of Object.entries(required)) {
              if (!value) throw new Error(`Missing generated value: ${name}`);
              console.log(`::add-mask::${value}`);
              const delimiter = `EOF_${crypto.randomBytes(8).toString("hex")}`;
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`, "utf8");
            }
          '

      - name: Verify database migration and drift
        run: pnpm db:verify

      - name: Build backend
        run: pnpm exec turbo run build --filter=@medsphere/auth-service

      - name: Build frontend
        run: pnpm --filter @medsphere/web build

      - name: Start backend
        run: |
          nohup node apps/auth-service/dist/main.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Start frontend
        run: |
          nohup pnpm --filter @medsphere/web exec next start -p 3001 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Certify V1 core runtime regression
        shell: bash
        run: |
          set +e
          node scripts/task5-smoke-test.mjs 2>&1 | tee /tmp/v1-core-runtime-regression-cert.log
          smoke_exit=${PIPESTATUS[0]}
          set -e

          # This is a single source of truth check against the script's
          # own final results matrix line for each required chain step,
          # rather than duplicating the script's internal pass/fail
          # logic here -- the same reuse pattern already used by
          # reservation-runtime-cert.yml and transfer-runtime-cert.yml.
          # Public Search and Notification checks are intentionally
          # excluded from this list: they remain fully visible in the
          # uploaded evidence log and still affect the full script's own
          # exit code, but they are not part of the required V1 core
          # runtime chain this job certifies, and Notification in
          # particular is explicitly out of scope (PR #108/#109).
          declare -a required_checks=(
            "service startup"
            "foundation seed (tenant, providers, product, admin role/permissions)"
            "registration (accepted API)"
            "authentication + authenticated session (real login, real cookies)"
            "provider-access grant (accepted backend API)"
            "RBAC allow (admin reads authorization catalogue)"
            "RBAC deny (no-role staff account denied inventory read)"
            "cross-tenant positive control (tenant B admin genuinely has inventory-read permission and access to its own provider)"
            "cross-tenant access is rejected (tenant B admin denied reading tenant A provider stock)"
            "dashboard unauthenticated protection (real server-side redirect to the exact login route)"
            "dashboard shell served for authenticated admin (server-rendered shell only, not post-hydration data -- see the separate browser runtime certification for that)"
            "dashboard browser runtime certification (real login, real hydration, real provider-dependent read path)"
            "inventory listing creation (accepted configureInventory API, real response semantics)"
            "batch receipt (accepted receiveBatch API)"
            "inventory read (real product/batch/quantities present)"
            "inventory mutation (quarantine actually mutated batch state)"
            "audit evidence (tenant/actor/resource/action/correlation all match)"
            "staff-assisted reservation creation (correct provider/product/quantity/status)"
            "reservation lifecycle (CONFIRM -> READY, correct resulting status each step)"
            "stock transfer (correct source/target quantities)"
          )

          missing=0
          for name in "${required_checks[@]}"; do
            escaped=$(printf '%s' "$name" | sed -e 's/[.[\*^$/+]/\\&/g' -e 's/(/\\(/g' -e 's/)/\\)/g')
            if ! grep -Eq "^WORKING[[:space:]]+\[required\] ${escaped}\$" /tmp/v1-core-runtime-regression-cert.log; then
              echo "V1 core runtime regression: required step was not WORKING: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo 'V1 core runtime regression certification FAILED: one or more required chain steps did not pass.'
            exit 1
          fi

          echo 'V1 CORE RUNTIME REGRESSION CERTIFICATION: PASS'
          echo "Full smoke script exit code: ${smoke_exit}. Public Search and Notification results remain visible in the evidence log but are non-authoritative for this verdict."

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Show frontend log on failure
        if: failure()
        run: cat /tmp/frontend.log || true

      - name: Upload V1 core runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-core-runtime-regression-evidence
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            /tmp/v1-core-runtime-regression-cert.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          [ -f /tmp/frontend.pid ] && kill "$(cat /tmp/frontend.pid)" 2>/dev/null || true
          exit 0
