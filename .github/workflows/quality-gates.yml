name: MedSphere Pull Request Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - feature/database-architecture

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Database, Lint, Test, and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://medsphere_ci:medsphere_ci@localhost:5432/medsphere_ci?schema=public
      REDIS_CLUSTER_URL: redis://localhost:6379
      RUN_AUTH_INFRASTRUCTURE_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medsphere_ci
          POSTGRES_PASSWORD: medsphere_ci
          POSTGRES_DB: medsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsphere_ci -d medsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Task 0046 exact formatting diagnostic
        run: |
          pnpm exec prettier --write \
            'apps/auth-service/src/inventory/dto/patient-pickup-proof-response.dto.ts' \
            'apps/auth-service/src/inventory/pickup-handoff.service.ts' \
            'apps/auth-service/src/inventory/reservation-lifecycle.service.ts' \
            'apps/auth-service/src/pos/pos-checkout.service.ts' \
            'apps/web/src/app/api/inventory/providers/[providerId]/availability-requests/[requestId]/responses/route.ts' \
            'apps/web/src/app/api/inventory/providers/[providerId]/availability-requests/route.ts' \
            'apps/web/src/app/api/patient/medicine-reservations/[reservationId]/pickup-proof/route.ts' \
            'apps/web/src/lib/availability-request-contract.ts' \
            'apps/web/src/lib/i18n-catalogs/patient-medicines.ts' \
            'apps/web/src/lib/i18n-catalogs/reservations.ts' \
            'apps/web/src/lib/patient-reservation-contract.ts' \
            'packages/database/scripts/verify-0046-upgrade.mjs' \
            'packages/database/src/audit.ts' \
            'scripts/production-runtime-certification.mjs'
          git diff -- 'apps/auth-service/src/inventory/dto/patient-pickup-proof-response.dto.ts' 'apps/auth-service/src/inventory/pickup-handoff.service.ts' 'apps/auth-service/src/inventory/reservation-lifecycle.service.ts' 'apps/auth-service/src/pos/pos-checkout.service.ts' 'apps/web/src/app/api/inventory/providers/[providerId]/availability-requests/[requestId]/responses/route.ts' 'apps/web/src/app/api/inventory/providers/[providerId]/availability-requests/route.ts' 'apps/web/src/app/api/patient/medicine-reservations/[reservationId]/pickup-proof/route.ts' 'apps/web/src/lib/availability-request-contract.ts' 'apps/web/src/lib/i18n-catalogs/patient-medicines.ts' 'apps/web/src/lib/i18n-catalogs/reservations.ts' 'apps/web/src/lib/patient-reservation-contract.ts' 'packages/database/scripts/verify-0046-upgrade.mjs' 'packages/database/src/audit.ts' 'scripts/production-runtime-certification.mjs'
          if ! git diff --quiet -- 'apps/auth-service/src/inventory/dto/patient-pickup-proof-response.dto.ts' 'apps/auth-service/src/inventory/pickup-handoff.service.ts' 'apps/auth-service/src/inventory/reservation-lifecycle.service.ts' 'apps/auth-service/src/pos/pos-checkout.service.ts' 'apps/web/src/app/api/inventory/providers/[providerId]/availability-requests/[requestId]/responses/route.ts' 'apps/web/src/app/api/inventory/providers/[providerId]/availability-requests/route.ts' 'apps/web/src/app/api/patient/medicine-reservations/[reservationId]/pickup-proof/route.ts' 'apps/web/src/lib/availability-request-contract.ts' 'apps/web/src/lib/i18n-catalogs/patient-medicines.ts' 'apps/web/src/lib/i18n-catalogs/reservations.ts' 'apps/web/src/lib/patient-reservation-contract.ts' 'packages/database/scripts/verify-0046-upgrade.mjs' 'packages/database/src/audit.ts' 'scripts/production-runtime-certification.mjs'; then
            exit 1
          fi

      - name: Verify clean database migration and drift
        run: pnpm db:verify

      - name: Verify populated S0.3 through G3.9 upgrade safety
        run: pnpm db:verify-upgrade

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
