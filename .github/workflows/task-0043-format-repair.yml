name: Task 0043 formatting repair

on:
  push:
    branches:
      - cto/0043-pharmacy-pos-billing-gst-invoice

permissions:
  contents: write

concurrency:
  group: task-0043-format-repair
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cto/0043-pharmacy-pos-billing-gst-invoice
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format remaining Task 0043 files
        run: |
          pnpm exec prettier --write \
            apps/auth-service/src/pos/pos-checkout.integration.spec.ts \
            apps/auth-service/src/pos/pos-checkout.service.ts \
            apps/web/src/lib/i18n-catalogs/pos.ts

      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/auth-service/src/pos/pos-checkout.integration.spec.ts \
            apps/auth-service/src/pos/pos-checkout.service.ts \
            apps/web/src/lib/i18n-catalogs/pos.ts
          git commit -m "chore(pos): format remaining Task 0043 files"
          git push origin HEAD:cto/0043-pharmacy-pos-billing-gst-invoice
