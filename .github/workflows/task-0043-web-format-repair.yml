name: Task 0043 web formatting repair

on:
  push:
    branches:
      - cto/0043-pharmacy-pos-billing-gst-invoice

permissions:
  contents: write

concurrency:
  group: task-0043-web-format-repair
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/0043-pharmacy-pos-billing-gst-invoice
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 0043 web files
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/pos/pos-workspace.tsx \
            apps/web/src/lib/pos-contract.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/pos/pos-workspace.tsx apps/web/src/lib/pos-contract.ts
          git commit -m "chore(pos): format POS web workspace and contracts"
          git push origin HEAD:cto/0043-pharmacy-pos-billing-gst-invoice
